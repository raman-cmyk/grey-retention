name: Design copies

# Copies the inspiration email the owner chose for "Use this design" with
# Copy (DES-ENGINE-002b2): the chosen email's design, section by section,
# with the brand's own colours, fonts, logo, words and photos. A server
# function cannot run a browser, so this job does: it asks the live app for
# one copy at a time (with CRON_SECRET), runs the design engine's library
# copy in Chromium with JavaScript off and no request but the photos the
# job fetched itself from the server's fixed list of hosts
# (scripts/design-copies.mjs), uploads the cut photos through their signed
# upload links and reports the copy. Then the emails whose copies are in go
# on: their checks, and into Klaviyo as drafts. The repository is public,
# so its logs are too: it prints counts only, never an email, a link, a
# brand's words or the secret.
#
# Off until turned on, exactly like the scheduled jobs
# (docs/SCHEDULED_JOBS_RUNBOOK.md): the same CRON_SECRET repository secret
# and the same SCHEDULED_JOBS_ENABLED=true repository variable. When no
# copy is waiting, a run makes one small request (the peek). The app asks
# for copies only with the owner's switch DESIGN_LIBRARY_COPY=on. Every 10
# minutes: the email waits for its copy (public repository: Actions minutes
# are free).
on:
  schedule:
    # Every 10 minutes, between the studio renders (5, 15, …) and the
    # sweeps (3, 33): minutes 8, 18, … (the inbox screenshots run at 18 and
    # 48 in their own job).
    - cron: '8-58/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-copies
  cancel-in-progress: false

jobs:
  copies:
    if: vars.SCHEDULED_JOBS_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The peek may be tried twice, 2 minutes apart (CI-005); the setup takes
    # about 5 minutes; a run claims a copy only while the whole copy fits in
    # its 12 minutes, then carries the emails on (at most 2): a run ends
    # well inside this limit, never in the middle of a copy.
    timeout-minutes: 30
    env:
      APP_URL: https://grey-retention-app.vercel.app
    steps:
      - name: Anything to copy?
        id: peek
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # CI-005: the secret without stray spaces or line breaks, sent
          # through stdin (-H @-) so it never appears in the process list;
          # GitHub also masks it. HTTPS only. A call with no answer or an
          # error is tried once more after 2 minutes; the run fails only
          # when both tries fail, and says the app's own error.
          secret=$(printf '%s' "$CRON_SECRET" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -z "$secret" ]; then
            echo "::error::Add the CRON_SECRET repository secret (see docs/SCHEDULED_JOBS_RUNBOOK.md)."
            exit 1
          fi
          echo "::add-mask::$secret"
          call() {
            local try status reason
            for try in 1 2; do
              rm -f "$2"
              status=$(printf 'Authorization: Bearer %s\n' "$secret" |
                curl -H @- --proto '=https' --silent --show-error --max-time "$3" \
                  --output "$2" --write-out '%{http_code}' "$APP_URL$1") || status=000
              if [ "$status" = "200" ]; then return 0; fi
              reason=$(jq -r '.error // .code // .message // empty' "$2" 2>/dev/null | tr '\r\n' '  ' | sed 's/ *$//' | head -c 300)
              if [ -z "$reason" ] && [ -s "$2" ]; then reason=$(tr '\r\n' '  ' < "$2" | sed 's/ *$//' | head -c 300); fi
              if [ "$try" = 1 ]; then
                echo "::warning::The app returned HTTP $status${reason:+ ($reason)}. Trying again in 2 minutes."
                sleep 120
              else
                echo "::error::The app returned HTTP $status${reason:+ ($reason)} on both tries."
              fi
            done
            return 1
          }
          call '/api/internal/design/copies?peek=1' peek.json 30 || exit 1
          waiting=$(jq -r '(.waiting | numbers) // 0' peek.json)
          echo "Copies waiting: $waiting."
          echo "waiting=$waiting" >> "$GITHUB_OUTPUT"
      - if: steps.peek.outputs.waiting != '0'
        uses: actions/checkout@v4
        with:
          # The browser draws strangers' designs: no token left on the runner.
          persist-credentials: false
      - if: steps.peek.outputs.waiting != '0'
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - if: steps.peek.outputs.waiting != '0'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.peek.outputs.waiting != '0'
        run: pnpm install --frozen-lockfile
      - if: steps.peek.outputs.waiting != '0'
        run: pnpm exec playwright install chromium
      # Best effort, as in browser.yml: only optional fonts come from apt.
      - if: steps.peek.outputs.waiting != '0'
        continue-on-error: true
        timeout-minutes: 5
        run: sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update && pnpm exec playwright install-deps chromium || echo "::warning::apt unavailable; using the runner's preinstalled libraries"
      - name: Copy the chosen designs
        if: steps.peek.outputs.waiting != '0'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node --import ./scripts/ts-register.mjs scripts/design-copies.mjs
