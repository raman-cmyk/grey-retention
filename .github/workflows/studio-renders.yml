name: Studio renders

# Draws the designed sections of "Create email" builds (DST-001c, the design
# studio, D25). A server function cannot run a browser, so this job does: it
# asks the live app for sections to draw (with CRON_SECRET), draws each one in
# Chromium with JavaScript off and only that section's own origins allowed
# (scripts/section-render.mjs), and uploads the picture through its signed
# upload link. The repository is public, so its logs are too: it prints counts
# only, never a section, a link or the secret.
#
# Off until turned on, exactly like the scheduled jobs
# (docs/SCHEDULED_JOBS_RUNBOOK.md): the same CRON_SECRET repository secret
# and the same SCHEDULED_JOBS_ENABLED=true repository variable. When nothing
# is waiting, a run stops after one small request. Every 10 minutes: a build
# waits for its pictures (public repository: Actions minutes are free).
on:
  schedule:
    # Every 10 minutes, away from the sweeps (minutes 3 and 33) and the inbox
    # screenshots (18 and 48); inbox tagging also runs at 25 and 55.
    - cron: '5-55/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-renders
  cancel-in-progress: false

jobs:
  renders:
    if: vars.SCHEDULED_JOBS_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The first call may be tried twice, 2 minutes apart (CI-005).
    timeout-minutes: 18
    env:
      APP_URL: https://grey-retention-app.vercel.app
    steps:
      - name: Anything to photograph?
        id: peek
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # CI-005: the secret without stray spaces or line breaks (a pasted
          # line break stopped every call), sent through stdin (-H @-) so it
          # never appears in the process list; GitHub also masks it. HTTPS
          # only. A call with no answer or an error is tried once more after
          # 2 minutes; the run fails only when both tries fail, and says the
          # app's own error. call PATH FILE SECONDS
          secret=$(printf '%s' "$CRON_SECRET" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -z "$secret" ]; then
            echo "::error::Add the CRON_SECRET repository secret (see docs/SCHEDULED_JOBS_RUNBOOK.md)."
            exit 1
          fi
          # GitHub masks the stored value; the trimmed one is masked too.
          echo "::add-mask::$secret"
          call() {
            local try status reason
            for try in 1 2; do
              rm -f "$2"
              status=$(printf 'Authorization: Bearer %s\n' "$secret" |
                curl -H @- --proto '=https' --silent --show-error --max-time "$3" \
                  --output "$2" --write-out '%{http_code}' "$APP_URL$1") || status=000
              if [ "$status" = "200" ]; then return 0; fi
              reason=$(jq -r '.error // .code // .message // empty' "$2" 2>/dev/null | tr '\r\n' '  ' | sed 's/ *$//' | head -c 300)
              if [ -z "$reason" ] && [ -s "$2" ]; then reason=$(tr '\r\n' '  ' < "$2" | sed 's/ *$//' | head -c 300); fi
              if [ "$try" = 1 ]; then
                echo "::warning::The app returned HTTP $status${reason:+ ($reason)}. Trying again in 2 minutes."
                sleep 120
              else
                echo "::error::The app returned HTTP $status${reason:+ ($reason)} on both tries."
              fi
            done
            return 1
          }
          call '/api/internal/studio/renders?peek=1' peek.json 30 || exit 1
          waiting=$(jq -r '.waiting // 0' peek.json)
          echo "Sections waiting: $waiting"
          echo "waiting=$waiting" >> "$GITHUB_OUTPUT"
          # DST-006b: with nothing to draw, the designs waiting for pictures
          # drawn earlier go on now (after drawing, the script does this).
          if [ "$waiting" = "0" ]; then
            call '/api/internal/studio/builds' builds.json 130 || exit 1
            echo "Designs carried on: $(jq -r '.builds // 0' builds.json)"
          fi
      - if: steps.peek.outputs.waiting != '0'
        uses: actions/checkout@v4
        with:
          # The browser draws strangers' pages: no token left on the runner.
          persist-credentials: false
      - if: steps.peek.outputs.waiting != '0'
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - if: steps.peek.outputs.waiting != '0'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.peek.outputs.waiting != '0'
        run: pnpm install --frozen-lockfile
      - if: steps.peek.outputs.waiting != '0'
        run: pnpm exec playwright install chromium
      # Best effort, as in browser.yml: only optional fonts come from apt.
      - if: steps.peek.outputs.waiting != '0'
        continue-on-error: true
        timeout-minutes: 5
        run: sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update && pnpm exec playwright install-deps chromium || echo "::warning::apt unavailable; using the runner's preinstalled libraries"
      - name: Draw the sections
        if: steps.peek.outputs.waiting != '0'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/studio-renders.mjs
