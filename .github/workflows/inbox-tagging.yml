name: Inbox tagging

# Tags waiting Inspiration inbox emails (CI-003). The sweep (minutes 3 and
# 33) leaves tagging only what is left of its 15 seconds, about one email
# live; this gives tagging its own run, between the sweeps and the
# screenshots. Jobs are leased, so two runs never work the same email at the
# same time, and the platform's daily AI budget (GEM-003) still caps the
# spend. Each run is one small request (no checkout, no install); the
# repository is public, so standard runner minutes are not billed.
#
# Off until turned on, exactly like the scheduled jobs
# (docs/SCHEDULED_JOBS_RUNBOOK.md): the same CRON_SECRET repository secret
# and the same SCHEDULED_JOBS_ENABLED=true repository variable. It prints
# counts only, never a link or the secret.
on:
  schedule:
    - cron: '10,25,40,55 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: inbox-tagging
  cancel-in-progress: false

jobs:
  tagging:
    if: vars.SCHEDULED_JOBS_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Two tries, 2 minutes apart (CI-005).
    timeout-minutes: 6
    env:
      APP_URL: https://grey-retention-app.vercel.app
    steps:
      - name: Tag waiting emails
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # CI-005: the secret without stray spaces or line breaks (a pasted
          # line break stopped every call), sent through stdin (-H @-) so it
          # never appears in the process list; GitHub also masks it. HTTPS
          # only. A call with no answer or an error is tried once more after
          # 2 minutes; the run fails only when both tries fail, and says the
          # app's own error. call PATH FILE SECONDS
          secret=$(printf '%s' "$CRON_SECRET" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -z "$secret" ]; then
            echo "::error::Add the CRON_SECRET repository secret (see docs/SCHEDULED_JOBS_RUNBOOK.md)."
            exit 1
          fi
          # GitHub masks the stored value; the trimmed one is masked too.
          echo "::add-mask::$secret"
          call() {
            local try status reason
            for try in 1 2; do
              rm -f "$2"
              status=$(printf 'Authorization: Bearer %s\n' "$secret" |
                curl -H @- --proto '=https' --silent --show-error --max-time "$3" \
                  --output "$2" --write-out '%{http_code}' "$APP_URL$1") || status=000
              if [ "$status" = "200" ]; then return 0; fi
              reason=$(jq -r '.error // .code // .message // empty' "$2" 2>/dev/null | tr '\r\n' '  ' | sed 's/ *$//' | head -c 300)
              if [ -z "$reason" ] && [ -s "$2" ]; then reason=$(tr '\r\n' '  ' < "$2" | sed 's/ *$//' | head -c 300); fi
              if [ "$try" = 1 ]; then
                echo "::warning::The app returned HTTP $status${reason:+ ($reason)}. Trying again in 2 minutes."
                sleep 120
              else
                echo "::error::The app returned HTTP $status${reason:+ ($reason)} on both tries."
              fi
            done
            return 1
          }
          ok=0
          call '/api/internal/inbox/tags' run.json 75 || ok=1
          jq -c '{state, live, emails, sections, untagged, retried, deferred, code}' run.json 2>/dev/null || true
          exit $ok
