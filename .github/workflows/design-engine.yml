name: Design engine

# DES-ENGINE-001: the email design engine's golden set. Each of the 40 test
# emails (features/design-engine/golden) is measured in Chromium with
# JavaScript off and only inline pictures allowed (Chromium's own OS sandbox
# where the runner allows one), drawn back from its
# blueprint, measured again and compared for likeness and unchanged content;
# at least 36 must pass. The sandbox and limit tests use loopback servers. The
# engine's other browser tests run too. No app, no database, no secret and
# no outside request: the emails and their pictures are made in code.
#
# DES-ENGINE-002: the library 1:1 gate runs in the same step (with the real
# centre cut since DES-ENGINE-002b1: library-brand-canvas, floor 18). The 20
# library-shaped emails are copied for a synthetic test brand (its colours,
# fonts, logo, photos, products and words); at least 18 must keep the
# original's structure, and no copy may show a word, picture, link or name
# of the original. Its pictures (original | brand copy | phone) go to
# design-golden/library-brand (and library-brand-no-crop: the same without
# a photo cropper, as live stores are today).
#
# DES-ENGINE-002b2: the same 20 copies, drawn for Klaviyo, also go through
# the email's hard checks as Create email stores them (Gmail size, links,
# Klaviyo's footer, alt text, the max discount, spam, accessibility); at
# least 18 must pass. The copy job loads the engine as the blueprint job.
#
# PICK-006: the token gate. The library 1:1 gate also runs for the test
# brand with each sample site's design tokens (library-brand*-tokens-*,
# same floors, no leak); Scratch's step draws the same layouts for both
# looks (design-golden/tokens) and the coded blocks get their own step.
#
# DES-ENGINE-003: the uploaded emails. The 20 upload-shaped emails are made
# ready as an owner's upload is (their pictures kept as empty drawings of
# their own size) and measured as the upload job measures them, as the
# brand's own design and as another brand's email; the prepared email must
# measure like the original file (at least 18 of 20), and another brand's
# blueprint keeps no picture and no link.
#
# The results, a summary and a side-by-side picture of every email (the
# original, the redraw, the redraw on a phone and both layouts as grey
# boxes) are uploaded as the `design-golden` artifact on every run, so the
# owner can look at them.
on:
  pull_request:
    paths:
      - 'features/design-engine/**'
      - 'features/blocks/**'
      - 'features/inbox/sections.ts'
      - 'lib/sandbox/**'
      - 'scripts/inbox-screenshots.mjs'
      - 'scripts/inbox-blueprints.mjs'
      - 'scripts/design-copies.mjs'
      - 'scripts/design-uploads.mjs'
      - 'scripts/ts-hooks.mjs'
      - 'scripts/ts-register.mjs'
      - 'scripts/section-render.mjs'
      - 'features/email-uploads/**'
      - 'features/email-build/library-copy.ts'
      - 'features/email-build/library-copy.browser.test.ts'
      - 'features/email-build/hard-checks.ts'
      - 'features/email-build/scratch.ts'
      - 'features/email-build/scratch.browser.test.ts'
      - 'features/email-build/tokens.browser.test.ts'
      - 'features/onboarding/site/tokens.ts'
      - 'features/onboarding/site/sample.ts'
      - 'features/email-build/copy-jobs.ts'
      - 'features/email-build/library-step.ts'
      - 'features/email-build/scratch-step.ts'
      - 'scripts/design-blocks.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/design-engine.yml'
  push:
    branches: [main]
    paths:
      - 'features/design-engine/**'
      - 'features/blocks/**'
      - 'features/inbox/sections.ts'
      - 'lib/sandbox/**'
      - 'scripts/inbox-blueprints.mjs'
      - 'scripts/design-copies.mjs'
      - 'scripts/design-uploads.mjs'
      - 'scripts/ts-hooks.mjs'
      - 'scripts/ts-register.mjs'
      - 'features/email-uploads/**'
      - 'features/email-build/library-copy.ts'
      - 'features/email-build/hard-checks.ts'
      - 'features/email-build/scratch.ts'
      - 'features/onboarding/site/tokens.ts'
      - 'features/onboarding/site/sample.ts'
      - 'features/email-build/copy-jobs.ts'
      - 'features/email-build/library-step.ts'
      - 'features/email-build/scratch-step.ts'
      - 'scripts/design-blocks.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      # Best effort, as in browser.yml: ubuntu-latest already has Chromium's
      # libraries, and the Ubuntu mirror sometimes fails to resolve.
      - name: Install browser system packages (best effort)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          for attempt in 1 2; do
            if sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update && pnpm exec playwright install-deps chromium; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 20 seconds."
            sleep 20
          done
          echo "::warning::apt unavailable; using the runner's preinstalled libraries"
      # DES-ENGINE-002: the blueprint job runs the engine in plain Node (its
      # own type stripping and scripts/ts-register.mjs), not through Vite:
      # load everything that job loads the same way, so a TypeScript form
      # Node cannot strip, or an import it cannot find, fails here first.
      - name: The blueprint job loads the engine as production does
        run: node --import ./scripts/ts-register.mjs -e "const m = await import('./features/design-engine/stored.ts'); await import('./scripts/inbox-blueprints.mjs'); await import('./features/design-engine/library-copy.ts'); await import('./features/design-engine/photos.ts'); await import('./scripts/design-copies.mjs'); await import('./features/email-build/library-copy.ts'); const u = await import('./features/email-uploads/measure.ts'); await import('./scripts/design-uploads.mjs'); const b = await import('./features/design-engine/blocks.ts'); await import('./scripts/design-blocks.mjs'); if (typeof b.checkBlock !== 'function' || typeof u.measureUpload !== 'function' || typeof m.measureForStorage !== 'function' || !m.ENGINE_VERSION) process.exit(1)"
      - name: Golden set and browser tests
        env:
          DESIGN_ENGINE_BROWSER: 'on'
          DESIGN_GOLDEN_OUT: design-golden
        run: pnpm exec vitest run features/design-engine
      - name: Library copies through the email's hard checks
        env:
          DESIGN_ENGINE_BROWSER: 'on'
        run: pnpm exec vitest run features/email-build/library-copy.browser.test.ts
      # DES-ENGINE-004b: 10 Scratch emails of different goals built from the
      # block library of the golden emails (pictures in design-golden/scratch).
      - name: Scratch emails from the block library
        env:
          DESIGN_ENGINE_BROWSER: 'on'
          DESIGN_GOLDEN_OUT: design-golden
        run: pnpm exec vitest run features/email-build/scratch.browser.test.ts
      # PICK-006: the token gate's coded-block half (the Scratch half runs
      # above); pictures in design-golden/tokens.
      - name: Design tokens on the coded blocks
        env:
          DESIGN_ENGINE_BROWSER: 'on'
          DESIGN_GOLDEN_OUT: design-golden
        run: pnpm exec vitest run features/email-build/tokens.browser.test.ts
      - name: Uploaded emails measured as the upload job measures them
        env:
          DESIGN_ENGINE_BROWSER: 'on'
        run: pnpm exec vitest run features/email-uploads
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-golden
          path: design-golden/
          retention-days: 30
          if-no-files-found: warn
