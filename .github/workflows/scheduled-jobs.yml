name: Scheduled jobs

# Runs queued background work (drafts, designs, reports, sample scheduling)
# on the live app every 30 minutes. Vercel's Hobby plan allows only a daily
# cron (see vercel.json), so this is the frequent trigger. Both call the same
# endpoint, which is safe to call twice at once.
#
# Off until turned on (docs/SCHEDULED_JOBS_RUNBOOK.md):
# - repository secret CRON_SECRET: the same value as CRON_SECRET in Vercel.
# - repository variable SCHEDULED_JOBS_ENABLED=true turns the schedule on.
#   Without it every run is skipped and uses no Actions minutes.
#
# Each enabled run uses about one Actions minute (GitHub rounds up per job),
# so every 30 minutes is about 1,500 minutes a month (owner decision, to stay
# inside the free allowance; every 10 minutes would be about 4,400).
on:
  schedule:
    # Minute 3 and 33 of every hour, avoiding the busy top of the hour.
    - cron: '3,33 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    if: vars.SCHEDULED_JOBS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run queued jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOBS_URL: https://grey-retention-app.vercel.app/api/internal/jobs
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Add the CRON_SECRET repository secret (see docs/SCHEDULED_JOBS_RUNBOOK.md)."
            exit 1
          fi
          # The header goes through stdin so the secret never appears in the
          # process list; GitHub also masks it in the log. HTTPS only.
          status=$(printf 'header = "Authorization: Bearer %s"\n' "$CRON_SECRET" |
            curl --config - --proto '=https' --silent --show-error --max-time 90 \
              --output response.json --write-out '%{http_code}' "$JOBS_URL") || status=000
          if [ -f response.json ]; then cat response.json; echo; fi
          if [ "$status" != "200" ]; then
            echo "::error::The job run returned HTTP $status."
            exit 1
          fi
          failed=$(jq -r '.failed // 0' response.json)
          if [ "$failed" != "0" ]; then
            echo "::warning::$failed workspace visit(s) stopped on an error; their jobs stay queued. See the Vercel function logs."
          fi
