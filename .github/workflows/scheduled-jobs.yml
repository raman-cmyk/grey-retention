name: Scheduled jobs

# Runs queued background work (drafts, designs, reports, sample scheduling)
# on the live app every 30 minutes. Vercel's Hobby plan allows only a daily
# cron (see vercel.json), so this is the frequent trigger. Both call the same
# endpoint, which is safe to call twice at once.
#
# Off until turned on (docs/SCHEDULED_JOBS_RUNBOOK.md):
# - repository secret CRON_SECRET: the same value as CRON_SECRET in Vercel.
# - repository variable SCHEDULED_JOBS_ENABLED=true turns the schedule on.
#   Without it every run is skipped and uses no Actions minutes.
#
# Each enabled run uses about one Actions minute (GitHub rounds up per job),
# so every 30 minutes is about 1,500 minutes a month (owner decision, to stay
# inside the free allowance; every 10 minutes would be about 4,400).
on:
  schedule:
    # Minute 3 and 33 of every hour, avoiding the busy top of the hour.
    - cron: '3,33 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    if: vars.SCHEDULED_JOBS_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Two tries, 2 minutes apart (CI-005).
    timeout-minutes: 7
    steps:
      - name: Run queued jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://grey-retention-app.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Add the CRON_SECRET repository secret (see docs/SCHEDULED_JOBS_RUNBOOK.md)."
            exit 1
          fi
          # CI-005: the secret without stray spaces or line breaks (a pasted
          # line break stopped every call), sent through stdin (-H @-) so it
          # never appears in the process list; GitHub also masks it. HTTPS
          # only. A call with no answer or an error is tried once more after
          # 2 minutes; the run fails only when both tries fail, and says the
          # app's own error. call PATH FILE SECONDS
          secret=$(printf '%s' "$CRON_SECRET" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          call() {
            local try status reason
            for try in 1 2; do
              rm -f "$2"
              status=$(printf 'Authorization: Bearer %s\n' "$secret" |
                curl -H @- --proto '=https' --silent --show-error --max-time "$3" \
                  --output "$2" --write-out '%{http_code}' "$APP_URL$1") || status=000
              if [ "$status" = "200" ]; then return 0; fi
              reason=$(jq -r '.error // .code // .message // empty' "$2" 2>/dev/null | tr -d '\r\n' | head -c 300)
              if [ -z "$reason" ] && [ -s "$2" ]; then reason=$(tr -d '\r\n' < "$2" | head -c 300); fi
              if [ "$try" = 1 ]; then
                echo "::warning::The app returned HTTP $status${reason:+ ($reason)}. Trying again in 2 minutes."
                sleep 120
              else
                echo "::error::The app returned HTTP $status${reason:+ ($reason)} on both tries."
              fi
            done
            return 1
          }
          call /api/internal/jobs response.json 90 || exit 1
          cat response.json
          echo
          failed=$(jq -r '.failed // 0' response.json)
          if [ "$failed" != "0" ]; then
            echo "::warning::$failed workspace visit(s) stopped on an error; their jobs stay queued. See the Vercel function logs."
          fi
