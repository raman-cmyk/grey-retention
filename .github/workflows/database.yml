name: Database

# pgTAP / RLS assertions on a fresh local Supabase. Runs only when the schema,
# seeds or database tests change (or by hand), and skips draft pull requests.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'supabase/**'
      - '.github/workflows/database.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only the services the tests use: database, auth, REST, storage, mail.
      - run: pnpm exec supabase start -x studio,logflare,vector,imgproxy,edge-runtime,realtime,postgres-meta,supavisor
      - run: pnpm supabase:reset
      - run: pnpm test:db
