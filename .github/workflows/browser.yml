name: Browser

# Desktop and mobile Playwright journeys plus the concurrency scripts, on a
# fresh local Supabase with fake providers. Runs only when app, test or
# database files change (or by hand), and skips draft pull requests.
# Do not make this a required check: with path filters it does not run on
# every pull request, and a required check that never starts blocks merging.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - 'components/**'
      - 'features/**'
      - 'lib/**'
      - 'supabase/**'
      - 'scripts/*.mjs'
      - 'tests/e2e/**'
      - 'tests/helpers/**'
      - 'playwright.config.ts'
      - 'next.config.ts'
      - 'proxy.ts'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      # The runner's Ubuntu mirror sometimes fails to resolve; retry the
      # system packages so a mirror hiccup doesn't fail the browser job
      # before any test runs.
      - name: Install browser system packages (with retries)
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 update && pnpm exec playwright install-deps chromium; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 20 seconds."
            sleep 20
          done
          exit 1
      # Only the services the journeys use: database, auth, REST, storage, mail.
      - run: pnpm exec supabase start -x studio,logflare,vector,imgproxy,edge-runtime,realtime,postgres-meta,supavisor
      - run: pnpm supabase:reset
      # A step limit (inside the job limit) makes a slow run fail rather than be
      # cancelled, so the report below is still uploaded.
      - run: pnpm test:e2e
        timeout-minutes: 30
      - run: node scripts/test-first-draft.mjs
      - run: node scripts/test-email-concurrency.mjs
      - run: node scripts/test-email-import-concurrency.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          # Hidden folders (.audit with local passwords) are never included.
          include-hidden-files: false
