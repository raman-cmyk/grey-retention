name: CI

# The required check for every pull request and every push to main:
# format, lint, typecheck, unit tests and production build.
# Database (pgTAP) and browser journeys run in database.yml and browser.yml,
# only when files they cover change, to keep private-repo minutes affordable.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its older run; runs on main are
  # never cancelled, so every merge gets its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Branch protection requires this job by name: keep the id `verify` and
  # never give it a job-level `if:` or path filter.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
