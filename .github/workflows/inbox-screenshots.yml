name: Inbox screenshots

# Takes the 600px screenshot of every new Inspiration inbox email (INB-002).
# A server function cannot run a browser, so this job does: it asks the live
# app for emails to photograph (with CRON_SECRET), renders each one in
# Chromium with JavaScript off and only that email's own stored files
# allowed, and uploads the picture through its signed upload link. It prints counts
# only, never a link or the secret.
#
# DES-ENGINE-002: then it measures each photographed email's blueprint (its
# structure for "Use this design", Copy) in the same locked browser with the
# design engine, pictures and links dropped (scripts/inbox-blueprints.mjs),
# and reports it to the app the same way.
#
# Off until turned on, exactly like the scheduled jobs
# (docs/SCHEDULED_JOBS_RUNBOOK.md): the same CRON_SECRET repository secret
# and the same SCHEDULED_JOBS_ENABLED=true repository variable. When nothing
# is waiting, a run stops after one small request.
on:
  schedule:
    # 15 minutes after each sweep (minutes 3 and 33), so the images are kept first.
    - cron: '18,48 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inbox-screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    if: vars.SCHEDULED_JOBS_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The first call may be tried twice, 2 minutes apart (CI-005).
    timeout-minutes: 30
    env:
      APP_URL: https://grey-retention-app.vercel.app
    steps:
      - name: Anything to photograph?
        id: peek
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # CI-005: the secret without stray spaces or line breaks (a pasted
          # line break stopped every call), sent through stdin (-H @-) so it
          # never appears in the process list; GitHub also masks it. HTTPS
          # only. A call with no answer or an error is tried once more after
          # 2 minutes; the run fails only when both tries fail, and says the
          # app's own error. call PATH FILE SECONDS
          secret=$(printf '%s' "$CRON_SECRET" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -z "$secret" ]; then
            echo "::error::Add the CRON_SECRET repository secret (see docs/SCHEDULED_JOBS_RUNBOOK.md)."
            exit 1
          fi
          # GitHub masks the stored value; the trimmed one is masked too.
          echo "::add-mask::$secret"
          call() {
            local try status reason
            for try in 1 2; do
              rm -f "$2"
              status=$(printf 'Authorization: Bearer %s\n' "$secret" |
                curl -H @- --proto '=https' --silent --show-error --max-time "$3" \
                  --output "$2" --write-out '%{http_code}' "$APP_URL$1") || status=000
              if [ "$status" = "200" ]; then return 0; fi
              reason=$(jq -r '.error // .code // .message // empty' "$2" 2>/dev/null | tr '\r\n' '  ' | sed 's/ *$//' | head -c 300)
              if [ -z "$reason" ] && [ -s "$2" ]; then reason=$(tr '\r\n' '  ' < "$2" | sed 's/ *$//' | head -c 300); fi
              if [ "$try" = 1 ]; then
                echo "::warning::The app returned HTTP $status${reason:+ ($reason)}. Trying again in 2 minutes."
                sleep 120
              else
                echo "::error::The app returned HTTP $status${reason:+ ($reason)} on both tries."
              fi
            done
            return 1
          }
          call '/api/internal/inbox/screenshots?peek=1' peek.json 30 || exit 1
          # The blueprints' peek failing never stops the screenshots.
          if ! call '/api/internal/inbox/blueprints?peek=1' blueprints.json 30; then
            echo '{"waiting":0}' > blueprints.json
          fi
          shots=$(jq -r '(.waiting | numbers) // 0' peek.json)
          blueprints=$(jq -r '(.waiting | numbers) // 0' blueprints.json)
          waiting=$((shots + blueprints))
          echo "Screenshots waiting: $shots. Blueprints waiting: $blueprints."
          echo "waiting=$waiting" >> "$GITHUB_OUTPUT"
      - if: steps.peek.outputs.waiting != '0'
        uses: actions/checkout@v4
      - if: steps.peek.outputs.waiting != '0'
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - if: steps.peek.outputs.waiting != '0'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.peek.outputs.waiting != '0'
        run: pnpm install --frozen-lockfile
      - if: steps.peek.outputs.waiting != '0'
        run: pnpm exec playwright install chromium
      # Best effort, as in browser.yml: only optional fonts come from apt.
      - if: steps.peek.outputs.waiting != '0'
        continue-on-error: true
        timeout-minutes: 5
        run: sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update && pnpm exec playwright install-deps chromium || echo "::warning::apt unavailable; using the runner's preinstalled libraries"
      - name: Take the screenshots
        if: steps.peek.outputs.waiting != '0'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/inbox-screenshots.mjs
      # The design engine is TypeScript: Node strips the types, and
      # scripts/ts-register.mjs finds its files as the app does.
      # Measured even when the screenshots step failed (each email's
      # blueprint job stands on its own); not when the run is cancelled.
      - name: Measure the blueprints
        if: ${{ !cancelled() && steps.peek.outputs.waiting != '0' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node --import ./scripts/ts-register.mjs scripts/inbox-blueprints.mjs
